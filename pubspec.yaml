name: mboistats
description: "A new Flutter project."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 3.3.6+76

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  app_settings: ^6.1.1
  cached_network_image: ^3.0.0
  carousel_slider: ^5.0.0
#  connectivity: ^3.0.6
  cupertino_icons: ^1.0.2
  dio: ^5.4.2+1
  fluttertoast: ^8.2.4
  flutter_downloader: ^1.6.1
  file_picker: ^10.2.0
  flutter_file_downloader: ^2.0.0
  html: ^0.15.0
  html_unescape: ^2.0.0
  http: ^1.2.0
  open_file: ^3.2.1
  shared_preferences: ^2.0.0
  # open_settings: ^2.0.2
  # package_info: ^2.0.2
  path_provider: ^2.0.11
  permission_handler: ^12.0.1
  # saf: ^1.0.3+4
  saf:
    path: local_packages/saf
  syncfusion_flutter_pdfviewer: ^29.1.38
  toast: ^0.3.0
  url_launcher: ^6.0.13
  webview_flutter: ^4.13.0
  webview_flutter_plus: ^0.4.4
  connectivity_plus: ^6.1.4
  open_settings_plus: ^0.4.0
  package_info_plus: ^8.3.0
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  
  # firebase_core: ^3.2.0 
  # firebase_auth: ^5.1.2 
  # cloud_firestore: ^5.1.0

  # --- PERBAIKAN: Upgrade ke v9 ---
  # v8.1.2 tidak kompatibel dengan flutter_inappwebview v6 (yang kita perlukan).
  # v9.0.0+ sudah kompatibel.
  youtube_player_flutter: ^9.0.1 # <-- DI-UPGRADE DARI 8.1.2
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.5.7

  provider: ^6.1.2

# package_info: ^2.0.3

  
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# --- INI TETAP DIPERLUKAN ---
# Ini akan memaksa semua plugin (seperti webview_flutter_plus)
# untuk menggunakan versi inappwebview yang baru.
dependency_overrides:
  flutter_inappwebview: ^6.0.0
# --- AKHIR TAMBAHAN ---

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/web/
    - .env
    # - assets/icons/mboistatsLogo.png
    # ... (sisa aset Anda) ...

  fonts:
    - family: SF-Pro-Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/mboistats_icon.png"
  min_sdk_android: 21 
  # ... (sisa konfigurasi launcher_icons) ...
