pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(rootProject.projectDir.parentFile, "local.properties")
        if (localPropertiesFile.exists()) {
             localPropertiesFile.withReader('UTF-8') { reader -> properties.load(reader) }
        } else {
             localPropertiesFile = new File(rootProject.projectDir, "local.properties")
             if (localPropertiesFile.exists()) {
                 localPropertiesFile.withReader('UTF-8') { reader -> properties.load(reader) }
            }
        }
        def flutterSdkPathValue = properties.getProperty("flutter.sdk")
        assert flutterSdkPathValue != null, "flutter.sdk not set in local.properties. Try running 'flutter doctor --android-licenses' and check for the file at 'C:\\projectflutter\\mboistats\\android\\local.properties' or 'C:\\projectflutter\\mboistats\\local.properties'."
        return flutterSdkPathValue
    }()

    includeBuild "$flutterSdkPath/packages/flutter_tools/gradle"

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}


plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '8.6.0' apply false
    
    // --- INI PERBAIKANNYA ---
    // Naikkan versi Kotlin untuk mengatasi error metadata
    id "org.jetbrains.kotlin.android" version '2.0.0' apply false
    // --- AKHIR PERBAIKAN ---

    id 'com.google.gms.google-services' version '4.3.15' apply false
}

include ':app'

